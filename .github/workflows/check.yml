name: Uniqlo Stock Checker

on:
  schedule:
    - cron: '*/15 * * * *'  # Automatically runs every 15 minutes on autopilot
  workflow_dispatch:        # Forces the manual "Run workflow" button to appear

jobs:
  check-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # CRITICAL FIX: Explicitly grants permission to push changes back to your repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run stock checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PRODUCT_URLS: ${{ secrets.PRODUCT_URLS }}
        run: python check_stock.py

      - name: Save state back to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stock_state.json
          git commit -m "Automated inventory update" || exit 0
          git push
